<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- 引用本地 FontAwesome；优化(P2-4)：静态资源自动指纹 -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ static_versioned('fontawesome/css/all.min.css') }}">
    <style>
        body {
            /* 增加中文字体支持 */
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Heiti SC", "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }
        .login-card {
            background: white;
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .brand i { font-size: 48px; color: #2563eb; margin-bottom: 16px; display: block; }
        .brand span { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #111827; }
        .subtitle { color: #6b7280; font-size: 14px; margin: 8px 0 32px 0; }

        /* 新增：密码框包裹层，用于定位图标 */
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            /* 右侧留出 45px 给眼睛图标，避免文字重叠 */
            padding: 14px 45px 14px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
            text-align: center; /* 文字居中 */
            background: white;
            color: #1f2937;
            /* 移除 letter-spacing 以防止中文显示间距过大 */
            letter-spacing: normal;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* 新增：眼睛图标样式 */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            z-index: 10;
            font-size: 18px;
            padding: 5px; /* 增大点击热区 */
        }
        .toggle-password:hover { color: #2563eb; }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
        }
        button:hover { background: #1d4ed8; transform: translateY(-1px); }

        .flash-msg {
            color: #b91c1c;
            font-size: 13px;
            margin-bottom: 20px;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fecaca;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .back-link { margin-top: 24px; display: block; font-size: 13px; color: #6b7280; text-decoration: none; }
        .back-link:hover { color: #2563eb; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <i class="fa-brands fa-dropbox"></i>
            <span>派大星网盘</span>
        </div>
        <p class="subtitle">{{ subtitle }}</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <!-- 修改结构：包裹层 + 输入框 + 图标 -->
            <div class="password-wrapper">
                <input type="password" id="pwdInput" name="password" placeholder="请输入口令" required autofocus autocomplete="off">
                <!-- 这里的 fa-eye 依赖于本地 FontAwesome 文件 -->
                <i class="fa-solid fa-eye toggle-password" id="toggleIcon" onclick="togglePassword()" title="显示/隐藏口令"></i>
            </div>
            
            <button type="submit">进入系统</button>
        </form>

        {% if 'admin' in request.path %}
            <a href="{{ url_for('index') }}" class="back-link">← 返回文件列表</a>
        {% endif %}
    </div>

    <!-- 脚本：控制显示/隐藏 -->
    <script>
        function togglePassword() {
            const input = document.getElementById('pwdInput');
            const icon = document.getElementById('toggleIcon');
            
            if (input.type === "password") {
                // 切换为文本模式：此时浏览器允许输入中文
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                // 保持光标在输入框内
                input.focus();
            } else {
                // 切换回密码模式
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                input.focus();
            }
        }
    </script>
</body>
</html>

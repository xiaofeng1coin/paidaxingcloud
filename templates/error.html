<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - 派大星网盘</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Heiti SC", "Segoe UI", Roboto, sans-serif;
            color: #1f2937;
        }
        .card {
            text-align: center;
            background: white;
            padding: 48px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 90vw;
            box-sizing: border-box;
        }
        .code {
            font-size: 56px;
            font-weight: 800;
            color: #2563eb;
            letter-spacing: -1px;
            line-height: 1;
        }
        .msg { color: #6b7280; margin: 14px 0 28px; font-size: 15px; }
        a {
            display: inline-block;
            padding: 10px 28px;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">{{ code }}</div>
        <div class="msg">{{ message }}</div>
        <a href="{{ url_for('index') }}">返回首页</a>
    </div>
</body>
</html>
